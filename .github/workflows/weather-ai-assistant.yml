name: Weather AI Assistant CI

on:
  push:
    paths:
      - "weather-ai-assistant/**"
      - ".github/workflows/weather-ai-assistant.yml"
  pull_request:
    paths:
      - "weather-ai-assistant/**"
      - ".github/workflows/weather-ai-assistant.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather-ai-assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: weather-ai-assistant/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: GraphQL schema smoke test
        run: python -c "from weather_assistant.graphql_schema import create_schema; create_schema()"
