name: Spanish NLP Toolkit CI

on:
  push:
    paths:
      - "spanish-nlp-toolkit/**"
      - ".github/workflows/spanish-nlp-toolkit.yml"
  pull_request:
    paths:
      - "spanish-nlp-toolkit/**"
      - ".github/workflows/spanish-nlp-toolkit.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spanish-nlp-toolkit

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spanish-nlp-toolkit/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
