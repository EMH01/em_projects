name: AI ML Labs CI

on:
  push:
    paths:
      - "ai-ml-labs/**"
      - ".github/workflows/ai-ml-labs.yml"
  pull_request:
    paths:
      - "ai-ml-labs/**"
      - ".github/workflows/ai-ml-labs.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-ml-labs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-ml-labs/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
