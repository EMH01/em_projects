name: Document AI CI

on:
  push:
    paths:
      - "document-ai-assistant/**"
      - ".github/workflows/document-ai.yml"
  pull_request:
    paths:
      - "document-ai-assistant/**"
      - ".github/workflows/document-ai.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-ai-assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: document-ai-assistant/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
