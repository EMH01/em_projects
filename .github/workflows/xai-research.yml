name: XAI Research CI

on:
  push:
    paths:
      - "xai-perturbation-research/**"
      - ".github/workflows/xai-research.yml"
  pull_request:
    paths:
      - "xai-perturbation-research/**"
      - ".github/workflows/xai-research.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xai-perturbation-research

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: xai-perturbation-research/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
