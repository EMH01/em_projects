[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ml-labs"
version = "0.1.0"
description = "Curated AI/ML experiments spanning computer vision, distributed ML and multimodal models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "Pillow>=10.4",
]

[project.optional-dependencies]
torch = [
  "torch>=2.4",
  "torchvision>=0.19",
]
spark = [
  "matplotlib>=3.9",
  "pyspark>=3.5",
  "scikit-learn>=1.5",
]
multimodal = [
  "openai>=1.68",
]
streamlit = [
  "streamlit>=1.37",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_ml_labs"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ai_ml_labs"]
